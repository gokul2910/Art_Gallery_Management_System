<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("reg.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .register-container {
      background: rgba(255, 255, 255, 0.9); /* slight transparency so image is visible */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      width: 400px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0072ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #0057cc;
    }
    p {
      margin-top: 15px;
      font-size: 14px;
    }
    a {
      color: #0072ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>User Registration</h2>
    <form onsubmit="return registerUser()">
      <input type="text" id="username" placeholder="Enter Username" required><br>
      <input type="password" id="password" placeholder="Enter Password" required><br>
      <input type="email" id="email" placeholder="Enter Mail ID" required><br>
      <input type="tel" id="mobile" placeholder="Enter Mobile Number" pattern="[0-9]{10}" required><br>
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login Here</a></p>
  </div>

  <script>
  function registerUser() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const email = document.getElementById("email").value;
    const mobile = document.getElementById("mobile").value;

    fetch("http://localhost:8081/api/users/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password, mobile })
    })
      .then(response => response.json())
      .then(data => {
        alert("🎉 Registration Successful!\n\nPlease login the website to proceed!");
        window.location.href = "login.html";
      })
      .catch(error => {
        alert("Registration failed. Is the backend running?");
        console.error(error);
      });

    return false;
  }
</script>
</body>
</html>
